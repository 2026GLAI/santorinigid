# Настройка развёртывания Worker модерации отзывов.
#
# Развернуть / обновить:
#   npx wrangler deploy -c worker/wrangler-reviews.toml
# Секреты (вводятся один раз, значения запрашивает сам wrangler):
#   npx wrangler secret put GITHUB_TOKEN -c worker/wrangler-reviews.toml
#   npx wrangler secret put ADMIN_SECRET -c worker/wrangler-reviews.toml
#
# Письма шлёт ВСТРОЕННАЯ почта Cloudflare (Email Routing домена
# santorinigid.com, включена 28.07.2026) — решение владельца «меньше
# платформ»: никакого Resend и лишних ключей.
#
# Секретов в этом файле НЕТ и быть не должно: репозиторий открытый.
# Здесь только несекретные настройки и привязки.

name = "santorinigid-reviews"
main = "review-worker.js"
compatibility_date = "2026-07-01"

# Право отправлять письма владельцу через почту Cloudflare.
# Адрес назначения зашит намеренно: письма модерации могут уходить
# ТОЛЬКО на подтверждённый адрес владельца, никуда больше.
[[send_email]]
name = "OWNER_MAIL"
destination_address = "2026glai@gmail.com"

# Камера хранения отзывов до решения владельца.
# Отзыв стирается сразу после решения; нерешённый — сам через 30 дней.
[[kv_namespaces]]
binding = "REVIEWS"
id = "ab69ee2ac8c04e108353d79da3c910d9"

[vars]
# Рабочая почта модерации (решение владельца 28.07.2026 — его рабочий
# аккаунт для этих задач); santorinivip@gmail.com — публичная, здесь
# не используется. Адрес обязан совпадать с destination_address выше.
OWNER_EMAIL = "2026glai@gmail.com"
GITHUB_REPO = "2026GLAI/santorinigid"
GITHUB_BRANCH = "main"
SITE_URL = "https://santorinigid.com"
WORKER_URL = "https://santorinigid-reviews.2026glai.workers.dev"
