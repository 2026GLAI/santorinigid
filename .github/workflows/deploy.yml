# Автоматическая публикация сайта на GitHub Pages
#
# Что делает: при каждом изменении файлов в ветке main GitHub сам собирает
# сайт и выкладывает его в интернет. Ничего запускать вручную не нужно.
#
# Это же и есть механизм публикации отзывов: когда Worker дописывает
# одобренный отзыв в src/data/reviews.ts, срабатывает этот файл и сайт
# пересобирается — через 2–3 минуты отзыв виден гостям.
#
# ⚠️ НАСТРОИТЬ ОДИН РАЗ, ИНАЧЕ ПУБЛИКАЦИЯ ПАДАЕТ (проверено 27.07.2026):
#
#   Settings → Pages → Source: GitHub Actions
#
# Без этого сборка проходит, а последний шаг падает с ошибкой 404
# «Failed to create deployment … Ensure GitHub Pages has been enabled».
# Это не ошибка кода: файлы собраны, GitHub просто не знает, что их
# нужно публиковать.
#
# ⚠️ ВТОРОЕ УСЛОВИЕ — ВИДИМОСТЬ РЕПОЗИТОРИЯ.
# На бесплатном тарифе GitHub Pages работает ТОЛЬКО из открытого
# репозитория. Для приватного нужен GitHub Pro (~$4/мес).
# Первоисточник: docs.github.com «GitHub's products» —
# GitHub Free: «GitHub Pages in public repositories»;
# Pages в приватных репозиториях перечислен только у Pro.
#
# Если репозиторий приватный и тариф бесплатный — публикация будет
# падать с той же ошибкой 404, сколько её ни перезапускай.
# Выходы: сделать репозиторий публичным, оплатить Pro, либо перейти
# на Cloudflare Pages (там приватные репозитории бесплатны).

name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  # Кнопка «запустить вручную» на вкладке Actions — на случай если нужно
  # пересобрать сайт без изменений в файлах
  workflow_dispatch:
  # Автопересборка 1-го числа каждого месяца, 03:00 UTC — чтобы стаж
  # («31 год», «14 лет») и год в подвале сайта (©) обновлялись сами,
  # даже если владелец весь год ничего на сайте не менял. Время выбрано
  # ночным по UTC, чтобы не пересекаться с обычными правками владельца
  # (Греция, UTC+2/+3) — если правка и автозапуск совпадут, ничего не
  # ломается: concurrency-группа "pages" ниже просто выполнит их по очереди.
  schedule:
    - cron: '0 3 1 * *'

# Права, нужные для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Если пришло несколько изменений подряд — доводим до конца текущую сборку,
# лишние отменяем. Так отзывы не потеряются при быстрых нажатиях.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Собрать сайт
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы проекта
        uses: actions/checkout@v5

      # Node 24 — как на компьютере владельца. Держать версии одинаковыми,
      # чтобы сборка здесь и дома вела себя предсказуемо.
      #
      # ⚠️ ГЛАВНОЕ ПРО package-lock.json (сборка падала дважды 26.07.2026
      # с ошибкой «Missing: @emnapi/runtime from lock file»):
      #
      # Файл нельзя чинить командой `npm install` поверх существующего
      # node_modules — npm берёт данные оттуда и записывает НЕПОЛНОЕ дерево:
      # пропадают пакеты @emnapi/*, нужные Linux-сборке. Проверено трижды.
      #
      # Правильно: удалить И node_modules, И package-lock.json, затем
      # `npm install` начисто. Тогда записи появляются и `npm ci` проходит.
      #
      # Проверять так (обе команды должны отработать без EUSAGE):
      #   npm ci --dry-run --os=linux --cpu=x64
      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Печатаем версии: если сборка снова упадёт, причина видна сразу
      - name: Показать версии Node и npm
        run: node -v && npm -v

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Подготовить к публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Опубликовать
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Выложить в интернет
        id: deployment
        uses: actions/deploy-pages@v5
