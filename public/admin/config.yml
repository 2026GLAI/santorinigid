            collapsed: true
            fields:
              - { name: title, label: Заголовок вкладки (title), widget: string }
              - { name: description, label: '📝 Описание для поисковиков', widget: text }
          - name: hero
            label: Шапка страницы
            widget: object
            collapsed: true
            fields:
              - { name: image, label: '📷 Файл фото шапки', widget: string }
              - { name: alt, label: Описание фото для незрячих и поисковиков, widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Главный заголовок, widget: string }
              - { name: subtitle, label: Подзаголовок, widget: string }
              - { name: text, label: '📝 Текст под заголовком', widget: text }
              - { name: buttonTour, label: Кнопка «экскурсии», widget: string }
              - { name: buttonWhatsApp, label: Кнопка WhatsApp, widget: string }
          - name: about
            label: Блок «Знакомство»
            widget: object
            collapsed: true
            fields:
              - { name: photo, label: '📷 Файл портрета', widget: string }
              - { name: photoAlt, label: Описание фото, widget: string }
              - { name: badgeLabel, label: Подпись плашки на фото (число считается само), widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: lede, label: '📝 Первый абзац', widget: text }
              - { name: text, label: '📝 Второй абзац', widget: text }
              - { name: signature, label: Рукописная подпись под текстом, widget: string }
              - { name: button, label: Кнопка, widget: string }
          - name: servicesSection
            label: Блок «Услуги» — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: lede, label: '📝 Подводка', widget: text }
              - { name: moreLabel, label: Надпись «Подробнее →», widget: string }
          - name: services
            label: Карточки услуг
            label_singular: карточка
            widget: list
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { name: href, label: '🚫 Адрес страницы (НЕ МЕНЯТЬ)', widget: string }
              - { name: image, label: '📷 Файл фото', widget: string }
              - { name: title, label: Название, widget: string }
              - { name: text, label: '📝 Описание', widget: text }
              - { name: tag, label: Плашка на фото, widget: string }
          - name: crete
            label: Блок «С Крита»
            widget: object
            collapsed: true
            fields:
              - { name: image, label: '📷 Файл фото', widget: string }
              - { name: imageAlt, label: Описание фото, widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: intro, label: '📝 Вступление', widget: text }
              - name: tips
                label: Советы
                label_singular: совет
                widget: list
                summary: '{{fields.lead}}'
                fields:
                  - { name: lead, label: 'Жирное начало (с двоеточием)', widget: string }
                  - { name: text, label: '📝 Продолжение', widget: text }
              - { name: ferryButton, label: Кнопка расписания, widget: string }
          - name: cruise
            label: Блок «Круизным пассажирам»
            widget: object
            collapsed: true
            fields:
              - { name: image, label: '📷 Файл фото', widget: string }
              - { name: imageAlt, label: Описание фото, widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: intro1, label: '📝 Первый абзац', widget: text }
              - { name: intro2, label: '📝 Второй абзац', widget: text }
              - name: tips
                label: Варианты подъёма
                label_singular: вариант
                widget: list
                summary: '{{fields.lead}}'
                fields:
                  - { name: lead, label: 'Жирное начало (с двоеточием)', widget: string }
