              - { name: tag, label: Плашка на фото, widget: string }
              - { name: image, label: '📷 Файл фото (пусто = карточка без фото; у горы Пророка Ильи пусто НАМЕРЕННО)', widget: string, required: false }
              - { name: text, label: '📝 Описание (дословно со старого сайта)', widget: text }
          - name: arrivalSection
            label: Блок «Как попасть» — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: ferryButton, label: Кнопка расписания, widget: string }
          - name: arrival
            label: Способы добраться
            label_singular: способ
            widget: list
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: '📝 Текст', widget: text }
          - name: faqSection
            label: Блок вопросов — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
          - name: faq
            label: Вопросы и ответы
            label_singular: вопрос
            widget: list
            collapsed: true
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Вопрос, widget: string }
              - { name: a, label: '📝 Ответ', widget: text }
          - name: cta
            label: Синяя полоса-призыв внизу
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: '📝 Текст', widget: text }

      - name: about
        label: Страница «Обо мне»
        file: src/data/pages/about.json
        fields:
          - name: seo
            label: 'СЕО: заголовок и описание'
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок вкладки, widget: string }
