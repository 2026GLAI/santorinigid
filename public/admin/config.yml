              - { name: note, label: '📝 Врезка о встрече', widget: text }
              - { name: button, label: Кнопка, widget: string }
          - name: reviewsSection
            label: Блок отзывов — заголовок
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок, widget: string }

      - name: tours-page
        label: Страница «Экскурсии»
        file: src/data/pages/tours.json
        fields:
          - name: seo
            label: 'СЕО: заголовок и описание'
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок вкладки, widget: string }
              - { name: description, label: '📝 Описание для поисковиков', widget: text }
          - name: hero
            label: Шапка страницы
            widget: object
            collapsed: true
            fields:
              - { name: image, label: '📷 Файл фото', widget: string }
              - { name: alt, label: Описание фото, widget: string }
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Главный заголовок, widget: string }
              - { name: text, label: '📝 Текст под заголовком', widget: text }
