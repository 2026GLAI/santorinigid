          - { name: intro, label: '📝 Вступительный абзац', widget: text }
          - name: sightsSection
            label: Блок «Что посмотреть» — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
