          - name: routeSection
            label: Блок «Маршрут» — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: lede, label: '📝 Подводка', widget: text }
          - name: gallerySection
            label: Блок «Фотографии» — заголовки
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: lede, label: '📝 Подводка', widget: text }
          - name: reviewsSection
            label: Блок отзывов — заголовок
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок, widget: string }
          - name: cta
            label: Синяя полоса-призыв внизу
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: '📝 Текст', widget: text }

      - name: santorini
        label: Страница «О Санторини»
        file: src/data/pages/santorini.json
        fields:
          - name: seo
            label: 'СЕО: заголовок и описание'
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Заголовок вкладки, widget: string }
              - { name: description, label: '📝 Описание для поисковиков', widget: text }
          - name: hero
            label: Шапка страницы
            widget: object
            collapsed: true
            fields:
              - { name: image, label: '📷 Файл фото', widget: string }
